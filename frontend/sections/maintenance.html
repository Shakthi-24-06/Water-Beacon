<section class="maintenance-section" id="maintenance">
    <div class="container">

        <!-- Header -->
        <div class="maintenance-header reveal">
            <div class="section-tag">
                <span class="section-tag-dot"></span>
                <span data-i18n="maintenance">MAINTENANCE & SERVICING</span>
            </div>

            <h2 class="section-title">
                <span data-i18n="maintenanceTitle">Active Maintenance & Repairs</span>
            </h2>

            <p class="section-subtitle" data-i18n="maintenanceSubtitle">
                Transparent service logs, membrane replacement cycles, and repair tracking.
            </p>
        </div>

        <!-- Toolbar -->
        <div class="maintenance-toolbar reveal">
            <div class="maintenance-tabs">
                <button type="button" class="maint-tab-btn active" data-tab="ALL">
                    <span data-i18n="filterAllTickets">All Records</span>
                    <span class="tab-badge" id="maint-count-all">0</span>
                </button>
                <button type="button" class="maint-tab-btn" data-tab="ACTIVE">
                    <span data-i18n="filterActiveTickets">Active / Open</span>
                    <span class="tab-badge" id="maint-count-active">0</span>
                </button>
                <button type="button" class="maint-tab-btn" data-tab="COMPLETED">
                    <span data-i18n="filterCompletedTickets">Completed</span>
                    <span class="tab-badge" id="maint-count-completed">0</span>
                </button>
            </div>
        </div>

        <!-- Maintenance List Table -->
        <div class="maintenance-card-container modern-card reveal">
            <div class="table-responsive">
                <table class="maintenance-table">
                    <thead>
                        <tr>
                            <th data-i18n="machineCol">Station / Village</th>
                            <th data-i18n="issueTypeCol">Issue / Task</th>
                            <th data-i18n="startedCol">Reported Date</th>
                            <th data-i18n="statusCol">Service Status</th>
                            <th data-i18n="technicianCol">Technician</th>
                        </tr>
                    </thead>
                    <tbody id="maintenance-tbody">
                        <!-- Populated dynamically via JS -->
                    </tbody>
                </table>
            </div>

            <div class="maintenance-empty" id="maintenance-empty" style="display: none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
                <h4 data-i18n="allSystemsOperational">All Systems Operational</h4>
                <p data-i18n="noOpenTickets">No open maintenance tickets found for this filter.</p>
            </div>

            <!-- View All Toggle Footer -->
            <div class="maintenance-card-footer" id="maint-view-all-container" style="display: none;">
                <button type="button" class="btn-maint-view-all" id="btn-maint-view-all" aria-expanded="false">
                    <span id="btn-maint-view-all-text" data-i18n="viewAllMaintRecords">View All Maintenance Records</span>
                    <span class="btn-maint-badge" id="maint-total-badge" style="display: none;">0</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="btn-maint-view-all-icon">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </button>
            </div>
        </div>

    </div>
</section>
